<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product – ÉLAN</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--black:#111;--text:#222;--text-muted:#6b6b6b;--cream:#f8f5f0;--off-white:#fafafa;--border:#e8e4de;--header-h:64px}body{font-family:Inter,system-ui,sans-serif;color:var(--text);background:#fff;line-height:1.5;font-size:15px}img{max-width:100%;display:block}a{color:inherit;text-decoration:none}.container{width:min(1280px,92%);margin-inline:auto}.header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);height:var(--header-h)}.header-inner{display:flex;align-items:center;justify-content:space-between;height:100%}.logo{font-weight:600;font-size:1.35rem;letter-spacing:.28em;text-transform:uppercase}.nav{display:none}.header-actions{display:flex;align-items:center;gap:16px;font-size:.8rem}.footer{padding:28px 0;border-top:1px solid var(--border);font-size:.75rem;color:var(--text-muted)}.footer-bottom{display:flex;justify-content:space-between}.pdp{padding:40px 0 80px}.pdp-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:start}.pdp-gallery{position:sticky;top:80px}.pdp-main-img{aspect-ratio:3/4;overflow:hidden;background:var(--off-white);margin-bottom:12px}.pdp-main-img img{width:100%;height:100%;object-fit:cover}.pdp-thumbs{display:flex;gap:10px}.pdp-thumbs button{flex:1;aspect-ratio:1;border:1px solid transparent;padding:0;overflow:hidden;cursor:pointer;background:var(--off-white)}.pdp-thumbs button.active,.pdp-thumbs button:hover{border-color:var(--black)}.pdp-thumbs img{width:100%;height:100%;object-fit:cover}.pdp-info .breadcrumb{font-size:.75rem;color:var(--text-muted);margin-bottom:16px}.pdp-info h1{font-size:1.75rem;font-weight:400;letter-spacing:-.02em;margin-bottom:10px}.pdp-price{font-size:1.1rem;margin-bottom:24px}.pdp-price .sale{color:#a33;margin-right:8px}.pdp-price .old{text-decoration:line-through;color:var(--text-muted);font-size:.95rem}.pdp-desc{color:var(--text-muted);line-height:1.65;margin-bottom:28px;font-size:.95rem}.pdp-option{margin-bottom:24px}.pdp-option label{display:block;font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}.size-options,.color-options{display:flex;flex-wrap:wrap;gap:8px}.size-options button,.color-options button{min-width:44px;height:40px;padding:0 14px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:.85rem}.size-options button.active,.size-options button:hover,.color-options button.active,.color-options button:hover{border-color:var(--black);background:var(--black);color:#fff}.btn-add{width:100%;padding:16px;background:var(--black);color:#fff;border:none;font-size:.75rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;margin-bottom:12px}.btn-add:hover{background:#333}.btn-wishlist{width:100%;padding:14px;background:transparent;border:1px solid var(--border);font-size:.75rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}.pdp-details{margin-top:36px;padding-top:28px;border-top:1px solid var(--border)}.pdp-details h3{font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px}.pdp-details ul{list-style:none}.pdp-details li{font-size:.9rem;color:var(--text-muted);padding:6px 0;border-bottom:1px solid var(--border)}.pdp-details li:last-child{border-bottom:none}@media(max-width:800px){.pdp-grid{grid-template-columns:1fr;gap:28px}.pdp-gallery{position:static}.pdp{padding:24px 0 56px}}
  </style>
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="full.html" class="logo">ÉLAN</a>
      <div class="header-actions">
        <a href="full.html">← Back to shop</a>
      </div>
    </div>
  </header>
  <main class="pdp">
    <div class="container">
      <div class="pdp-grid" id="pdp-root"></div>
    </div>
  </main>
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom"><span>© 2026 ÉLAN</span><span><a href="full.html">Home</a></span></div>
    </div>
  </footer>
  <script>
const PRODUCTS=[{id:1,name:"Silk Slip Dress",price:248,badge:"New",category:"Dresses",img:"https://images.unsplash.com/photo-1595777457583-95e059d581b8?auto=format&fit=crop&w=1000&q=85",gallery:["https://images.unsplash.com/photo-1595777457583-95e059d581b8?auto=format&fit=crop&w=1000&q=85","https://images.unsplash.com/photo-1515372039744-b8f02a3ae446?auto=format&fit=crop&w=800&q=85","https://images.unsplash.com/photo-1566174053879-31528523f8ae?auto=format&fit=crop&w=800&q=85"],desc:"A fluid bias-cut slip dress in pure mulberry silk. Designed to skim the body with a subtle sheen, it moves effortlessly from day to evening.",details:["100% mulberry silk","Bias cut","Adjustable straps","Midi length","Dry clean only"],sizes:["XS","S","M","L"],colors:["Ivory","Black","Champagne"]},{id:2,name:"Cashmere Crew Neck",price:320,badge:null,category:"Tops",img:"https://images.unsplash.com/photo-1434389677669-e08b4cac3105?auto=format&fit=crop&w=1000&q=85",gallery:["https://images.unsplash.com/photo-1434389677669-e08b4cac3105?auto=format&fit=crop&w=1000&q=85","https://images.unsplash.com/photo-1576566588028-4147f3842f27?auto=format&fit=crop&w=800&q=85","https://images.unsplash.com/photo-1620799140408-edc6dcb6d633?auto=format&fit=crop&w=800&q=85"],desc:"Our signature crew neck in the softest Grade-A cashmere. A relaxed yet refined fit with a slightly dropped shoulder and ribbed trim.",details:["100% Grade-A cashmere","Relaxed fit","Ribbed cuffs and hem","Hand wash cold"],sizes:["XS","S","M","L","XL"],colors:["Camel","Oatmeal","Navy","Black"]},{id:3,name:"Wool Blend Coat",price:485,badge:"Bestseller",category:"Outerwear",img:"https://images.unsplash.com/photo-1539533018447-63fcce2678e3?auto=format&fit=crop&w=1000&q=85",gallery:["https://images.unsplash.com/photo-1539533018447-63fcce2678e3?auto=format&fit=crop&w=1000&q=85","https://images.unsplash.com/photo-1548126032-077b5163e0e6?auto=format&fit=crop&w=800&q=85","https://images.unsplash.com/photo-1591047139829-d91aecb6caea?auto=format&fit=crop&w=800&q=85"],desc:"A structured double-breasted coat in a warm wool-cashmere blend. Clean lines, notch lapels and a slightly oversized silhouette.",details:["80% wool, 20% cashmere","Double-breasted","Fully lined","Side pockets","Dry clean only"],sizes:["XS","S","M","L"],colors:["Camel","Charcoal","Black"]},{id:4,name:"High-Rise Tailored Trouser",price:198,badge:null,category:"Trousers",img:"https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?auto=format&fit=crop&w=1000&q=85",gallery:["https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?auto=format&fit=crop&w=1000&q=85","https://images.unsplash.com/photo-1506629082955-511b1aa784c0?auto=format&fit=crop&w=800&q=85","https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?auto=format&fit=crop&w=800&q=85"],desc:"Precision-tailored high-rise trousers with a straight leg and clean front. Cut from a soft Italian wool blend.",details:["Italian wool blend","High rise","Straight leg","Side zip","Dry clean"],sizes:["XS","S","M","L"],colors:["Black","Navy","Stone"]},{id:5,name:"Linen Wrap Blouse",price:165,badge:"New",category:"Tops",img:"https://images.unsplash.com/photo-1564257631407-4deb1f99dbaa?auto=format&fit=crop&w=1000&q=85",gallery:["https://images.unsplash.com/photo-1564257631407-4deb1f99dbaa?auto=format&fit=crop&w=1000&q=85","https://images.unsplash.com/photo-1551163943-3f7253a97023?auto=format&fit=crop&w=800&q=85","https://images.unsplash.com/photo-1485968579580-b6d546e6522a?auto=format&fit=crop&w=800&q=85"],desc:"A lightweight linen wrap blouse with a soft V-neck and tie waist. Effortlessly elegant.",details:["100% European linen","Wrap construction","Tie waist","Relaxed sleeves","Machine wash cold"],sizes:["XS","S","M","L"],colors:["White","Sage","Sand"]},{id:6,name:"Merino Knit Midi Skirt",price:210,badge:null,category:"Dresses",img:"https://images.unsplash.com/photo-1583496661160-fb5886a0aaaa?auto=format&fit=crop&w=1000&q=85",gallery:["https://images.unsplash.com/photo-1583496661160-fb5886a0aaaa?auto=format&fit=crop&w=1000&q=85","https://images.unsplash.com/photo-1550639525-c97d455acf70?auto=format&fit=crop&w=800&q=85","https://images.unsplash.com/photo-1572804013309-59aebfbaf7b5?auto=format&fit=crop&w=800&q=85"],desc:"A fine merino knit midi skirt with a gentle A-line silhouette. Soft, stretchy and endlessly wearable.",details:["100% merino wool","A-line silhouette","Elastic waist","Midi length","Hand wash"],sizes:["XS","S","M","L"],colors:["Black","Camel","Grey"]},{id:7,name:"Structured Blazer",price:375,badge:null,category:"Outerwear",img:"https://images.unsplash.com/photo-1591369822096-ffd140ec948f?auto=format&fit=crop&w=1000&q=85",gallery:["https://images.unsplash.com/photo-1591369822096-ffd140ec948f?auto=format&fit=crop&w=1000&q=85","https://images.unsplash.com/photo-1594938298603-c8148c4dae35?auto=format&fit=crop&w=800&q=85","https://images.unsplash.com/photo-1507679799987-c73779587ccf?auto=format&fit=crop&w=800&q=85"],desc:"A sharply tailored single-breasted blazer with a slightly elongated silhouette. Soft shoulder construction.",details:["Wool blend","Single-breasted","Soft shoulder","Fully lined","Dry clean"],sizes:["XS","S","M","L"],colors:["Black","Ivory","Navy"]},{id:8,name:"Satin Bias Cut Skirt",price:185,salePrice:148,badge:"Sale",category:"Dresses",img:"https://images.unsplash.com/photo-1572804013309-59aebfbaf7b5?auto=format&fit=crop&w=1000&q=85",gallery:["https://images.unsplash.com/photo-1572804013309-59aebfbaf7b5?auto=format&fit=crop&w=1000&q=85","https://images.unsplash.com/photo-1583496661160-fb5886a0aaaa?auto=format&fit=crop&w=800&q=85","https://images.unsplash.com/photo-1566174053879-31528523f8ae?auto=format&fit=crop&w=800&q=85"],desc:"A liquid satin bias-cut skirt that drapes and moves with the body. High-waisted with a concealed side zip.",details:["Acetate satin","Bias cut","High waist","Concealed zip","Dry clean"],sizes:["XS","S","M","L"],colors:["Black","Champagne","Emerald"]}];
const params=new URLSearchParams(window.location.search);
const id=parseInt(params.get('id')||'1',10);
const product=PRODUCTS.find(p=>p.id===id)||PRODUCTS[0];
document.title=product.name+' – ÉLAN';
const root=document.getElementById('pdp-root');
const priceHtml=product.salePrice?`<span class="sale">$${product.salePrice}</span><span class="old">$${product.price}</span>`:`$${product.price}`;
root.innerHTML=`
  <div class="pdp-gallery">
    <div class="pdp-main-img"><img src="${product.gallery[0]}" alt="${product.name}" id="main-img" /></div>
    <div class="pdp-thumbs">${product.gallery.map((src,i)=>`<button class="${i===0?'active':''}" data-src="${src}"><img src="${src}" alt="" /></button>`).join('')}</div>
  </div>
  <div class="pdp-info">
    <div class="breadcrumb"><a href="full.html">Home</a> / ${product.category} / ${product.name}</div>
    <h1>${product.name}</h1>
    <div class="pdp-price">${priceHtml}</div>
    <p class="pdp-desc">${product.desc}</p>
    <div class="pdp-option"><label>Color</label><div class="color-options">${product.colors.map((c,i)=>`<button class="${i===0?'active':''}">${c}</button>`).join('')}</div></div>
    <div class="pdp-option"><label>Size</label><div class="size-options">${product.sizes.map((s,i)=>`<button class="${i===1?'active':''}">${s}</button>`).join('')}</div></div>
    <button class="btn-add" id="add-btn">Add to bag</button>
    <button class="btn-wishlist">Add to wishlist</button>
    <div class="pdp-details"><h3>Details</h3><ul>${product.details.map(d=>`<li>${d}</li>`).join('')}</ul></div>
  </div>`;
root.querySelectorAll('.pdp-thumbs button').forEach(btn=>{btn.addEventListener('click',()=>{document.getElementById('main-img').src=btn.dataset.src;root.querySelectorAll('.pdp-thumbs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active')})});
root.querySelectorAll('.size-options button, .color-options button').forEach(btn=>{btn.addEventListener('click',()=>{btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('active'));btn.classList.add('active')})});
document.getElementById('add-btn')?.addEventListener('click',()=>alert('Added to bag: '+product.name));
  </script>
</body>
</html>
